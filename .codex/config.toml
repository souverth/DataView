# Playwright's built-in MCP server from the project's own dependency, launched
# with node directly (no npx). Requires `npm install`; paths are relative to the
# repo root, where Codex is started. --isolated gives each worker its own
# in-memory profile so parallel sessions don't lock each other.
[mcp_servers.playwright]
command = "node"
args = [
  "node_modules/playwright/cli.js",
  "run-mcp-server",
  "--browser",
  "msedge",
  "--isolated",
]
startup_timeout_sec = 30

[mcp_servers.codegraph]
command = "codegraph"
args = ["serve", "--mcp"]
